<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Bubu & Dudu Hugs 🐾 (v4.11)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background-color: #fceade;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    button {
      font-family: inherit;
    }

    /* ============ MÀN HÌNH CHÍNH ============ */
    .scene-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      border: 3px solid #f4a261;
      width: 320px;
      max-width: 92vw;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .gif-box {
      width: 130px;
      height: 130px;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gif-box img {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    .btn-action {
      background-color: #e76f51;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(231, 111, 81, 0.4);
      width: 100%;
      transition: 0.2s;
      margin-top: 5px;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    .version-tag {
      font-size: 0.72rem;
      color: #b08968;
      margin-top: 8px;
      font-weight: bold;
    }

    /* ============ NÚT 'T' Ở GÓC DƯỚI ============ */
    .btn-t-corner {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: rgba(244, 162, 97, 0.5);
      color: #9c5a2e;
      border: 1px solid #f4a261;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.2s;
    }

    .btn-t-corner:active {
      transform: scale(0.9);
      background-color: #e76f51;
      color: white;
    }

    /* ============ POPUP XEM LOG ============ */
    .log-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }

    .log-modal.open {
      display: flex;
    }

    .log-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      width: 320px;
      max-width: 90vw;
      border: 3px solid #f4a261;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      position: relative;
    }

    .log-card-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 8px;
    }

    .log-card-header.has-title {
      justify-content: space-between;
    }

    .log-card-title {
      font-weight: bold;
      font-size: 1rem;
      color: #e76f51;
      display: none;
    }

    .log-card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-clear-logs {
      background: none;
      border: none;
      color: #e76f51;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .btn-clear-logs:active {
      opacity: 0.7;
    }

    .log-card-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #b08968;
      cursor: pointer;
    }

    .log-pin-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
    }

    .log-pin-input {
      width: 130px;
      padding: 8px;
      border: 2px solid #f4a261;
      border-radius: 10px;
      outline: none;
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 0.4rem;
      text-indent: 0.4rem;
      font-family: inherit;
    }

    .log-pin-error {
      font-size: 0.78rem;
      color: #e76f51;
      font-weight: bold;
      min-height: 1.1em;
    }

    .log-content {
      display: none;
      max-height: 250px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.78rem;
    }

    .log-content.show {
      display: block;
    }

    .log-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(244, 162, 97, 0.3);
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-time {
      font-weight: bold;
      color: #e76f51;
      font-size: 0.72rem;
    }
    .log-delete-btn {
      background: none;
      border: none;
      color: #b08968;
      font-size: 0.72rem;
      cursor: pointer;
      float: right;
      padding: 0;
      font-weight: normal;
    }
    .log-delete-btn:active {
      opacity: 0.7;
    }

    .log-device {
      color: #2a9d8f;
      font-weight: bold;
    }

    .log-location {
      color: #d97706;
      font-size: 0.75rem;
      display: block;
      margin-top: 2px;
    }

    .log-status-viewed {
      display: inline-block;
      background-color: #e76f51;
      color: white;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .log-duration {
      font-size: 0.72rem;
      color: #d97706;
      font-weight: bold;
      margin-top: 3px;
      padding-left: 2px;
    }

    /* ============ KHUNG CHAT ============ */
    .chat-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      z-index: 200;
      background: #fceade;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-overlay.open {
      display: flex;
    }

    .chat-header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: #e76f51;
      color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .chat-back {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 8px;
    }

    .chat-title-box {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-title {
      font-weight: bold;
      font-size: 1.05rem;
      line-height: 1.1;
    }

    .chat-subtitle {
      font-size: 0.68rem;
      opacity: 0.85;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-clear-all {
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 5px 9px;
      border-radius: 50px;
      cursor: pointer;
    }

    .btn-clear-all:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .me-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      padding: 2px;
    }

    .me-switch button {
      border: none;
      background: none;
      color: white;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 5px 11px;
      border-radius: 50px;
      cursor: pointer;
    }

    .me-switch button.active {
      background: white;
      color: #e76f51;
    }

    /* Màn nhập mật khẩu chat */
    .pin-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 20px;
    }

    .pin-title {
      font-weight: bold;
      color: #333;
      font-size: 1rem;
    }

    .pin-hint {
      font-size: 0.82rem;
      color: #b08968;
    }

    .pin-input {
      width: 150px;
      padding: 10px;
      border: 2px solid #f4a261;
      border-radius: 12px;
      outline: none;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 0.5rem;
      text-indent: 0.5rem;
      font-family: inherit;
      background: white;
    }

    .pin-input:focus {
      border-color: #e76f51;
    }

    .pin-error {
      min-height: 1.1em;
      font-size: 0.82rem;
      font-weight: bold;
      color: #e76f51;
    }

    .pin-shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Vùng tin nhắn */
    .chat-body {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    .chat-body.open {
      display: flex;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-empty {
      margin: auto;
      text-align: center;
      color: #b08968;
      font-size: 0.9rem;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .msg-row.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.theirs {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 0.7rem;
      color: #b08968;
      margin: 4px 8px 1px;
    }

    .bubble {
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mine .bubble {
      background: #e76f51;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .theirs .bubble {
      background: white;
      color: #333;
      border: 1.5px solid #f4a261;
      border-bottom-left-radius: 5px;
    }

    .bubble img, .bubble video {
      max-width: 220px;
      max-height: 260px;
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      display: block;
    }

    .msg-meta {
      font-size: 0.68rem;
      color: #b08968;
      margin: 2px 8px 0;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .msg-delete {
      background: none;
      border: none;
      color: #e76f51;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .msg-row.show-actions .msg-delete {
      display: inline;
    }

    /* Thanh nhập kiểu app chat */
    .chat-composer {
      flex: none;
      padding: 8px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: #fff6ef;
      border-top: 1px solid rgba(244, 162, 97, 0.4);
    }

    .attach-preview {
      display: none;
      align-items: center;
      gap: 8px;
      background: white;
      border: 1.5px dashed #f4a261;
      border-radius: 12px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: #9c5a2e;
    }

    .attach-preview.show {
      display: flex;
    }

    .attach-preview span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attach-preview button {
      background: none;
      border: none;
      color: #e76f51;
      font-size: 1rem;
      cursor: pointer;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .icon-btn {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #fff0e6;
      color: #e76f51;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .composer-field {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: white;
      border: 2px solid #f4a261;
      border-radius: 22px;
      padding: 0 14px;
      min-width: 0;
    }

    .composer-field:focus-within {
      border-color: #e76f51;
    }

    .chat-input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.3;
      padding: 9px 0;
      max-height: 140px;
      background: none;
      min-width: 0;
    }

    .send-btn {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #2a9d8f;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(42, 157, 143, 0.4);
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    @media (prefers-reduced-motion: reduce) {
      .pin-shake { animation: none; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Màn hình chính -->
  <div class="scene-container">
    <div class="gif-box">
      <img id="bubuGif" src="bubu1.gif" alt="">
    </div>
    <button id="chatBtn" class="btn-action" onclick="openChat()">Ấn để chat với nhà gấu 🐾</button>
    <div class="version-tag">Version 4.11</div>
  </div>

  <!-- Nút T nhỏ ở góc dưới màn hình -->
  <button class="btn-t-corner" onclick="openLogModal()">T</button>

  <!-- Modal xem Log thiết bị -->
  <div id="logModal" class="log-modal">
    <div class="log-card">
      <div id="logCardHeader" class="log-card-header">
        <div id="logCardTitle" class="log-card-title">Nhật ký thiết bị</div>
        <div class="log-card-actions">
          <button id="btnClearLogs" class="btn-clear-logs" onclick="clearLogs()">🗑️ Xóa log</button>
          <button class="log-card-close" onclick="closeLogModal()">✕</button>
        </div>
      </div>

      <!-- Màn nhập mật khẩu Log -->
      <div id="logPinPanel" class="log-pin-panel">
        <input type="password" id="logPinInput" class="log-pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
        <div id="logPinError" class="log-pin-error"></div>
      </div>

      <!-- Nội dung Log -->
      <div id="logContent" class="log-content">
        <div id="logList">Đang tải nhật ký...</div>
      </div>
    </div>
  </div>

  <!-- Khung chat toàn màn hình -->
  <div id="chatOverlay" class="chat-overlay">
    <div class="chat-header">
      <button class="chat-back" onclick="closeChat()" aria-label="Quay lại">‹</button>
      <div class="chat-title-box">
        <div class="chat-title">Bubu & Dudu 💕</div>
        <div class="chat-subtitle">Version 4.11</div>
      </div>
      <div class="header-actions">
        <button id="clearAllBtn" class="btn-clear-all" onclick="confirmClearAll()" style="display: none;">🗑️ Xóa tất cả</button>
        <div id="meSwitch" class="me-switch" style="display: none;">
          <button data-me="Bubu" onclick="setMe('Bubu')">Bubu</button>
          <button data-me="Dudu" onclick="setMe('Dudu')">Dudu</button>
        </div>
      </div>
    </div>

    <!-- Nhập mật khẩu đăng nhập -->
    <div id="pinPanel" class="pin-panel">
      <div class="pin-title">Nhập mật khẩu 4 số</div>
      <div class="pin-hint">Gợi ý: sinh nhật của BuBu TIE 🦁</div>
      <input type="password" id="pinInput" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
      <div id="pinError" class="pin-error"></div>
    </div>

    <!-- Nội dung chat -->
    <div id="chatBody" class="chat-body">
      <div id="chatMessages" class="chat-messages"></div>

      <div class="chat-composer">
        <div id="attachPreview" class="attach-preview">
          <span id="attachName"></span>
          <button onpointerdown="event.preventDefault()" onclick="clearAttachment()" aria-label="Bỏ tệp">✕</button>
        </div>
        <div class="composer-row">
          <button class="icon-btn" onclick="document.getElementById('mediaFile').click()" aria-label="Đính kèm ảnh hoặc video">📎</button>
          <input type="file" id="mediaFile" accept="image/*,video/*" style="display: none;">
          <div class="composer-field">
            <textarea id="chatInput" class="chat-input" rows="1" placeholder="Nhắn gì đó thoải mái đi..." maxlength="5000"></textarea>
          </div>
          <button class="send-btn" onpointerdown="event.preventDefault()" onclick="sendMessage()" aria-label="Gửi">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABW8qlALzqJXB5GYReEz2gMFmIMHzHXBM",
      authDomain: "budu-note.firebaseapp.com",
      databaseURL: "https://budu-note-default-rtdb.firebaseio.com",
      projectId: "budu-note",
      storageBucket: "budu-note.firebasestorage.app",
      messagingSenderId: "751175174116",
      appId: "1:751175174116:web:13ceee8e30b1d22a0469f1"
    };

    let firebaseOk = true;
    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (err) {
      console.error('Firebase lỗi:', err);
      firebaseOk = false;
      const noop = function() { return ref; };
      const ref = { push: noop, on: noop, remove: noop, child: noop, update: noop, set: noop };
      db = { ref: function() { return ref; } };
    }

    /* ============ MẬT KHẨU LOG (0803) & HÀM BĂM SHA-256 ============ */
    const PIN_SALT = 'bubu-dudu-salt-v1';
    
    async function hashPin(pin) {
      const data = PIN_SALT + ':' + pin;
      if (window.crypto && window.crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h = 5381;
      for (let i = 0; i < data.length; i++) h = ((h * 33) ^ data.charCodeAt(i)) >>> 0;
      return 'f' + h.toString(16);
    }

    const LOG_PIN_HASH = 'ef499a560d7ac0a21c2c11d3398d605f2ad536e310c2914cad3a50b7771e4ab1';
    const LOG_PIN_HASH_FALLBACK = 'fdecdd054';

    /* ============ LOGIC GHI LOG TRUY CẬP & THỜI GIAN Ở LẠI (TỐI ƯU GỬI DỮ LIỆU) ============ */
    const DEVICE_MODELS = {
      '22071212AG': 'Xiaomi 12T',
      '22081212UG': 'Xiaomi 12T Pro',
      '23078PND5G': 'Xiaomi 13T',
      '2306EPN60G': 'Xiaomi 13T Pro',
      '2406APNFAG': 'Xiaomi 14T',
      '2407FPN8EG': 'Xiaomi 14T Pro',
      '2201123G': 'Xiaomi 12',
      '2211133G': 'Xiaomi 13',
      '23127PN0CG': 'Xiaomi 14',
      'SM-S911B': 'Samsung Galaxy S23',
      'SM-S918B': 'Samsung Galaxy S23 Ultra',
      'SM-S921B': 'Samsung Galaxy S24',
      'SM-S928B': 'Samsung Galaxy S24 Ultra',
      'SM-A546E': 'Samsung Galaxy A54',
      'SM-A556E': 'Samsung Galaxy A55'
    };

    function getScreenSignature() {
      const w = Math.min(window.screen.width, window.screen.height);
      const h = Math.max(window.screen.width, window.screen.height);
      const dpr = window.devicePixelRatio || 1;
      return `${w}x${h}@${dpr}`;
    }

    function guessIPhoneModel() {
      const res = getScreenSignature();
      const iosMap = {
        '375x667@2': 'iPhone SE / 6s / 7 / 8',
        '414x736@3': 'iPhone 6s+ / 7+ / 8+',
        '375x812@3': 'iPhone X / XS / 11 Pro / 12 mini / 13 mini',
        '414x896@2': 'iPhone XR / 11',
        '414x896@3': 'iPhone XS Max / 11 Pro Max',
        '390x844@3': 'iPhone 12 / 12 Pro / 13 / 13 Pro / 14',
        '428x926@3': 'iPhone 12 Pro Max / 13 Pro Max / 14 Plus',
        '393x852@3': 'iPhone 14 Pro / 15 / 15 Pro / 16',
        '430x932@3': 'iPhone 14 Pro Max / 15 Plus / 15 Pro Max / 16 Plus',
        '402x874@3': 'iPhone 16 Pro',
        '440x956@3': 'iPhone 16 Pro Max'
      };
      return iosMap[res] || 'iPhone';
    }

    async function detectDeviceInfo() {
      const ua = navigator.userAgent || '';
      const screenSig = getScreenSignature();
      let deviceName = 'Thiết bị không rõ';
      let browser = 'Trình duyệt khác';
      let rawModel = '';

      if (/iPhone/i.test(ua)) {
        deviceName = guessIPhoneModel();
      } else if (/iPad/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) {
        deviceName = 'iPad';
      } else if (/Android/i.test(ua)) {
        let model = '';
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
          try {
            const hints = await navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion']);
            if (hints.model) model = hints.model.trim();
          } catch (e) {}
        }
        if (!model) {
          const match = ua.match(/Android[^;]+;\s*([^)]+)\)/i);
          if (match && match[1]) {
            model = match[1].replace(/Build\/.*$/i, '').trim();
          }
        }
        rawModel = model;
        if (model && model !== 'K') {
          deviceName = DEVICE_MODELS[model] ? `${DEVICE_MODELS[model]} (${model})` : `Android (${model})`;
        } else {
          deviceName = 'Điện thoại Android';
        }
      } else if (/Windows/i.test(ua)) {
        deviceName = 'Windows PC';
      } else if (/Macintosh/i.test(ua)) {
        deviceName = 'MacBook / macOS';
      } else if (/Linux/i.test(ua)) {
        deviceName = 'Linux PC';
      }

      let isBrave = false;
      if (navigator.brave && typeof navigator.brave.isBrave === 'function') {
        try {
          isBrave = await navigator.brave.isBrave();
        } catch (e) {}
      }

      if (/FBAN|FBAV/i.test(ua)) browser = 'Facebook App';
      else if (/Zalo/i.test(ua)) browser = 'Zalo App';
      else if (/Instagram/i.test(ua)) browser = 'Instagram App';
      else if (isBrave || /Brave/i.test(ua)) browser = 'Brave';
      else if (/CocCoc/i.test(ua)) browser = 'Cốc Cốc';
      else if (/EdgA|EdgiOS|Edg/i.test(ua)) browser = 'Edge';
      else if (/OPR|Opera/i.test(ua)) browser = 'Opera';
      else if (/SamsungBrowser/i.test(ua)) browser = 'Samsung Internet';
      else if (/Firefox|FxiOS/i.test(ua)) browser = 'Firefox';
      else if (/CriOS/i.test(ua)) browser = 'Chrome (iOS)';
      else if (/Chrome/i.test(ua)) browser = 'Chrome';
      else if (/Safari/i.test(ua)) browser = 'Safari';

      return {
        summary: `${deviceName} · ${browser}`,
        rawUserAgent: ua,
        rawModel: rawModel,
        screen: screenSig,
        platform: navigator.platform || ''
      };
    }

    let currentLogKey = null;
    let chatSessionStartTime = null;

    async function logAccess() {
      try {
        const info = await detectDeviceInfo();

        // Lấy thông tin thành phố ngầm qua nhiều API dự phòng (tránh bị Brave hoặc nhà mạng chặn)
        let cityStr = 'Không rõ thành phố';
        const geoApis = [
          async () => {
            const res = await fetch('https://ipwho.is/');
            const d = await res.json();
            if (d && d.success !== false && d.city) return `${d.city}${d.country ? ', ' + d.country : ''}`;
            return null;
          },
          async () => {
            const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
            const d = await res.json();
            if (d && d.city) return `${d.city}${d.country ? ', ' + d.country : ''}`;
            return null;
          },
          async () => {
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();
            if (d && d.city) return `${d.city}${d.country_name ? ', ' + d.country_name : ''}`;
            return null;
          }
        ];

        for (const fetchGeo of geoApis) {
          try {
            const found = await fetchGeo();
            if (found) {
              cityStr = found;
              break;
            }
          } catch (e) {}
        }

        const newRef = db.ref('logs').push({
          device: info.summary,
          location: cityStr,
          rawUserAgent: info.rawUserAgent,
          rawModel: info.rawModel,
          screen: info.screen,
          platform: info.platform,
          viewedChat: false,
          durationSeconds: 0,
          timestamp: Date.now()
        });
        currentLogKey = newRef.key;
        try { sessionStorage.setItem('bubuLogKey', currentLogKey); } catch(e) {}
      } catch (err) {
        console.error('Không thể lưu log:', err);
      }
    }
    logAccess();

    function updateDurationOnServer() {
      if (!currentLogKey || !chatSessionStartTime) return;
      const elapsedSec = Math.floor((Date.now() - chatSessionStartTime) / 1000);
      if (elapsedSec > 0) {
        try {
          db.ref('logs/' + currentLogKey).child('durationSeconds').transaction(function(currentVal) {
            return (currentVal || 0) + elapsedSec;
          });
        } catch (e) {}
        chatSessionStartTime = Date.now();
      }
    }

    window.addEventListener('beforeunload', updateDurationOnServer);
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') {
        updateDurationOnServer();
      } else if (document.visibilityState === 'visible' && chatSessionStartTime) {
        chatSessionStartTime = Date.now();
      }
    });

    /* ============ LOGIC MODAL & MẬT KHẨU LOG ============ */
    let logUnlocked = false;

    function openLogModal() {
      document.getElementById('logModal').classList.add('open');
      if (!logUnlocked) {
        document.getElementById('logCardHeader').classList.remove('has-title');
        document.getElementById('logCardTitle').style.display = 'none';
        document.getElementById('btnClearLogs').style.display = 'none';
        document.getElementById('logPinPanel').style.display = 'flex';
        document.getElementById('logContent').classList.remove('show');
        document.getElementById('logPinError').textContent = '';
        const input = document.getElementById('logPinInput');
        input.value = '';
        setTimeout(() => input.focus(), 50);
      } else {
        showLogContent();
      }
    }

    function showLogContent() {
      document.getElementById('logCardHeader').classList.add('has-title');
      document.getElementById('logCardTitle').style.display = 'block';
      document.getElementById('btnClearLogs').style.display = 'block';
      document.getElementById('logPinPanel').style.display = 'none';
      document.getElementById('logContent').classList.add('show');
      listenToLogs();
    }

    function closeLogModal() {
      document.getElementById('logModal').classList.remove('open');
    }

    document.getElementById('logPinInput').addEventListener('input', async function(e) {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (e.target.value.length === 4) {
        let h = '';
        try {
          h = await hashPin(e.target.value);
        } catch (err) {
          document.getElementById('logPinError').textContent = 'Lỗi kiểm tra mật khẩu!';
          return;
        }
        if (h === LOG_PIN_HASH || h === LOG_PIN_HASH_FALLBACK) {
          logUnlocked = true;
          showLogContent();
        } else {
          document.getElementById('logPinError').textContent = 'Sai mật khẩu!';
          e.target.value = '';
        }
      }
    });

    function formatDuration(totalSeconds) {
      if (!totalSeconds || totalSeconds <= 0) return '';
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      if (mins === 0) return `⏱️ Đã ở lại: ${secs} giây`;
      return `⏱️ Đã ở lại: ${mins} phút ${secs} giây`;
    }

    function listenToLogs() {
      db.ref('logs').on('value', function(snapshot) {
        const logList = document.getElementById('logList');
        logList.innerHTML = '';
        const val = snapshot.val();
        if (!val) {
          logList.textContent = 'Chưa có nhật ký truy cập nào.';
          return;
        }

        const items = Object.entries(val).map(entry => ({ id: entry[0], ...entry[1] }))
                           .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        items.forEach(item => {
          const ts = item.timestamp || Date.now();
          const d = new Date(ts);
          const timeStr = !isNaN(d.getTime()) ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} - ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}` : '00:00 - --/--/----';
          
          const div = document.createElement('div');
          div.className = 'log-item';
          
          let badgeHtml = '';
          if (item.viewedChat) {
            badgeHtml = `<span class="log-status-viewed">ĐÃ XEM</span>`;
          }

          let durationHtml = '';
          if (item.viewedChat && item.durationSeconds > 0) {
            durationHtml = `<div class="log-duration">${formatDuration(item.durationSeconds)}</div>`;
          }

          const deviceName = item.device || 'Thiết bị không rõ';
          const locationName = item.location ? `📍 ${item.location}` : '📍 Không rõ vị trí';

          div.innerHTML = `<span class="log-time">[${timeStr}]</span> <button class="log-delete-btn" onclick="deleteSingleLog('${item.id}')">Xóa</button><br><span class="log-device">📱 ${deviceName}</span>${badgeHtml}<span class="log-location">${locationName}</span>${durationHtml}`;
          logList.appendChild(div);
        });
      });
    }

    function clearLogs() {
      if (confirm('Bạn có chắc chắn muốn xóa toàn bộ lịch sử log truy cập không? 🗑️')) {
        db.ref('logs').remove()
          .then(() => alert('Đã xóa sạch lịch sử log!'))
          .catch((err) => alert('Lỗi khi xóa log: ' + err.message));
      }
    }

    function deleteSingleLog(logId) {
      if (confirm('Bạn có muốn xóa mục log này không?')) {
        db.ref('logs/' + logId).remove()
          .catch((err) => alert('Lỗi khi xóa log: ' + err.message));
      }
    }

    /* ============ LOGIC CHAT BUBU & DUDU ============ */
    const PIN_HASH = 'e52970b369047515d3dd25be5bdcd9bd10e0cfec7801248c9d7de596ff2df504';
    const PIN_HASH_FALLBACK = 'fdece82f7';
    const DELETE_PIN_HASH = 'a34d7e85c4327364a66a5746b6a8ffb97a0d26cae27eb40403a17a31803942c2';
    const DELETE_PIN_HASH_FALLBACK = 'ff5fa1a3f';

    let chatUnlocked = false;
    const messages = new Map();

    async function verifyDeletePinPrompt(actionText) {
      const inputPin = prompt(actionText || 'Vui lòng nhập mật khẩu xóa dữ liệu:');
      if (!inputPin) return false;
      try {
        const h = await hashPin(inputPin.trim());
        if (h === DELETE_PIN_HASH || h === DELETE_PIN_HASH_FALLBACK) {
          return true;
        } else {
          alert('Sai mật khẩu xóa dữ liệu!');
          return false;
        }
      } catch (err) {
        alert('Có lỗi xảy ra khi kiểm tra mật khẩu.');
        return false;
      }
    }

    try {
      db.ref('notes').on('value', function(snapshot) {
        messages.clear();
        const val = snapshot.val();
        if (val) {
          Object.keys(val).forEach(function(key) {
            messages.set(key, val[key]);
          });
        }
        if (chatUnlocked) {
          renderChat(true);
        }
      });
    } catch (e) {
      console.error(e);
    }

    function showPinError(msg) {
      const input = document.getElementById('pinInput');
      document.getElementById('pinError').textContent = msg;
      input.value = '';
      input.classList.remove('pin-shake');
      void input.offsetWidth;
      input.classList.add('pin-shake');
    }

    function showPinScreen() {
      updateDurationOnServer();
      chatSessionStartTime = null;

      chatUnlocked = false;
      document.getElementById('pinPanel').style.display = 'flex';
      document.getElementById('chatBody').classList.remove('open');
      document.getElementById('meSwitch').style.display = 'none';
      document.getElementById('clearAllBtn').style.display = 'none';
      document.getElementById('pinError').textContent = '';
      const input = document.getElementById('pinInput');
      input.value = '';
      setTimeout(() => input.focus(), 50);
    }

    function unlockChat() {
      chatUnlocked = true;
      document.getElementById('pinPanel').style.display = 'none';
      document.getElementById('chatBody').classList.add('open');
      document.getElementById('meSwitch').style.display = 'flex';
      document.getElementById('clearAllBtn').style.display = 'block';
      document.getElementById('pinInput').blur();

      chatSessionStartTime = Date.now();

      if (!currentLogKey) {
        try { currentLogKey = sessionStorage.getItem('bubuLogKey'); } catch(e) {}
      }
      if (currentLogKey) {
        try {
          db.ref('logs/' + currentLogKey).update({ viewedChat: true });
        } catch (err) {
          console.error('Không thể cập nhật trạng thái đã xem:', err);
        }
      }

      try { applyMe(); } catch (err) { console.error(err); }
      
      renderChat(true);
    }

    function openChat() {
      document.getElementById('chatOverlay').classList.add('open');
      if (!chatUnlocked) showPinScreen();
    }

    function closeChat() {
      updateDurationOnServer();
      document.getElementById('chatInput').blur();
      document.getElementById('chatOverlay').classList.remove('open');
      showPinScreen();
    }

    document.getElementById('pinInput').addEventListener('input', async function(e) {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (e.target.value.length === 4) {
        let h = '';
        try {
          h = await hashPin(e.target.value);
        } catch (err) {
          showPinError('Lỗi kiểm tra mật khẩu');
          return;
        }
        if (h === PIN_HASH || h === PIN_HASH_FALLBACK) {
          unlockChat();
        } else {
          showPinError('Sai mật khẩu, thử lại nhé');
        }
      }
    });

    let me = 'Bubu';
    try {
      const saved = localStorage.getItem('bubuChatMe');
      if (saved === 'Bubu' || saved === 'Dudu') me = saved;
    } catch (err) {}

    function applyMe() {
      document.querySelectorAll('#meSwitch button').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.me === me);
      });
    }

    function setMe(name) {
      me = name;
      try { localStorage.setItem('bubuChatMe', name); } catch (err) {}
      applyMe();
      renderChat(false);
    }

    async function confirmClearAll() {
      const isAuth = await verifyDeletePinPrompt('Vui lòng nhập mật khẩu xóa dữ liệu để XÓA TẤT CẢ:');
      if (!isAuth) return;

      if (confirm('You sure want to clear all chat? 🗑️')) {
        db.ref('notes').remove()
          .then(() => alert('Đã xóa sạch toàn bộ dữ liệu tin nhắn cũ!'))
          .catch((err) => alert('Lỗi xóa dữ liệu: ' + err.message));
      }
    }

    const mediaFile = document.getElementById('mediaFile');
    mediaFile.addEventListener('change', function() {
      const file = mediaFile.files[0];
      const preview = document.getElementById('attachPreview');
      if (file) {
        document.getElementById('attachName').textContent = (file.type.startsWith('video') ? '🎬 ' : '🖼️ ') + file.name;
        preview.classList.add('show');
      } else {
        preview.classList.remove('show');
      }
    });

    function clearAttachment() {
      mediaFile.value = '';
      document.getElementById('attachPreview').classList.remove('show');
    }

    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendMessage() {
      const text = chatInput.value.trim();
      const file = mediaFile.files[0];
      if (!text && !file) return;

      const base = {
        sender: me,
        timestamp: Date.now()
      };
      if (text) base.text = text;

      if (file) {
        if (file.size > 8 * 1024 * 1024) {
          alert('Tệp quá lớn! Vui lòng chọn tệp nhỏ hơn 8MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          base.mediaUrl = e.target.result;
          base.mediaType = file.type.startsWith('video') ? 'video' : 'image';
          db.ref('notes').push(base);
        };
        reader.readAsDataURL(file);
      } else {
        db.ref('notes').push(base);
      }

      chatInput.value = '';
      clearAttachment();
      chatInput.focus();
    }

    function renderChat(scrollToBottom) {
      const box = document.getElementById('chatMessages');
      box.innerHTML = '';

      const list = Array.from(messages.entries())
        .map(function(entry) { return { id: entry[0], data: entry[1] }; })
        .sort(function(a, b) { return (a.data.timestamp || 0) - (b.data.timestamp || 0); });

      if (list.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'chat-empty';
        empty.textContent = 'Chưa có tin nhắn nào. Nhắn gì đó đi nè 💌';
        box.appendChild(empty);
        return;
      }

      list.forEach(function(item) {
        const data = item.data;
        const ts = data.timestamp || Date.now();
        const mine = data.sender === me;

        const row = document.createElement('div');
        row.className = 'msg-row ' + (mine ? 'mine' : 'theirs') + ' show-actions';

        const name = document.createElement('div');
        name.className = 'msg-sender';
        name.textContent = data.sender || 'Bubu';
        row.appendChild(name);

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (data.mediaUrl) {
          if (data.mediaType === 'video') {
            const v = document.createElement('video');
            v.src = data.mediaUrl;
            v.controls = true;
            v.playsInline = true;
            bubble.appendChild(v);
          } else {
            const img = document.createElement('img');
            img.src = data.mediaUrl;
            bubble.appendChild(img);
          }
        }
        if (data.text) {
          const t = document.createElement('span');
          t.textContent = data.text;
          bubble.appendChild(t);
        }

        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        const d = new Date(ts);
        const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        const time = document.createElement('span');
        time.textContent = timeStr;
        meta.appendChild(time);

        const del = document.createElement('button');
        del.className = 'msg-delete';
        del.textContent = 'Xóa';
        del.onclick = async function() {
          if (await verifyDeletePinPrompt('Vui lòng nhập mật khẩu xóa dữ liệu:')) {
            db.ref('notes/' + item.id).remove();
          }
        };
        meta.appendChild(del);

        row.appendChild(bubble);
        row.appendChild(meta);
        box.appendChild(row);
      });

      if (scrollToBottom) {
        box.scrollTop = box.scrollHeight;
      }
    }
  </script>
</body>
</html>
