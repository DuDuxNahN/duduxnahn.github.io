<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubu Dudu Todo List</title>
  <style>
    :root {
      --bg-color: #f7ede2;
      --card-bg: #fff5eb;
      --primary: #f4a261;
      --primary-hover: #e76f51;
      --text: #4a3e3d;
      --border: #e8d8c8;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 3px solid var(--border);
      text-align: center;
    }
    .header-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--primary-hover);
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
    }
    button.add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button.add-btn:hover {
      background: var(--primary-hover);
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    li {
      background: white;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }
    li.completed span {
      text-decoration: line-through;
      color: #aaa;
    }
    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Thay đường dẫn ảnh Bubu Dudu tùy thích -->
    <img src="https://gifdb.com/images/high/bubu-dudu-happy-dance-c956lyb9f5hvwytm.gif" alt="Bubu Dudu" class="header-img">
    <h1>Bubu Dudu Todo List 🐾</h1>
    
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="Thêm việc cần làm nhé...">
      <button class="add-btn" onclick="addTodo()">Thêm</button>
    </div>

    <ul id="todoList"></ul>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('bubu_todos')) || [];

    function render() {
      const list = document.getElementById('todoList');
      list.innerHTML = '';
      todos.forEach((item, index) => {
        const li = document.createElement('li');
        if (item.completed) li.classList.add('completed');
        li.innerHTML = `
          <span onclick="toggle(${index})" style="cursor:pointer; flex:1;">${item.text}</span>
          <button class="delete-btn" onclick="removeTodo(${index})">Xóa</button>
        `;
        list.appendChild(li);
      });
      localStorage.setItem('bubu_todos', JSON.stringify(todos));
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      if (input.value.trim() !== '') {
        todos.push({ text: input.value.trim(), completed: false });
        input.value = '';
        render();
      }
    }

    function toggle(index) {
      todos[index].completed = !todos[index].completed;
      render();
    }

    function removeTodo(index) {
      todos.splice(index, 1);
      render();
    }

    render();
  </script>
</body>
</html>
