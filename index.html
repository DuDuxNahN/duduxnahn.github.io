<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubu & Dudu Hugs 🐾</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fceade;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Container hiệu ứng chính */
    .scene-container {
      text-align: center;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 3px solid #f4a261;
      max-width: 90%;
      width: 380px;
    }

    .gif-box {
      width: 220px;
      height: 220px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gif-box img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 16px;
      object-fit: contain;
    }

    /* Nút bấm chính */
    .btn-action {
      background-color: #e76f51;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(231, 111, 81, 0.4);
      transition: all 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    /* Ô nhập lời nhắn (Khóa ban đầu) */
    .message-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
      animation: fadeIn 0.8s ease;
    }

    .message-input {
      padding: 12px 16px;
      border: 2px solid #f4a261;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
      text-align: center;
    }

    /* Tin nhắn bay lơ lửng */
    .floating-note {
      position: absolute;
      background: #ffffff;
      color: #e76f51;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      border: 2px solid #f4a261;
      pointer-events: none;
      white-space: nowrap;
      z-index: 1;
      animation: floatAround 12s infinite ease-in-out alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatAround {
      0% { transform: translate(0, 0) rotate(-5deg); }
      25% { transform: translate(60px, -80px) rotate(5deg); }
      50% { transform: translate(-50px, 100px) rotate(-3deg); }
      75% { transform: translate(80px, 50px) rotate(4deg); }
      100% { transform: translate(-70px, -60px) rotate(-5deg); }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <div class="gif-box">
      <!-- GIF ban đầu: Dudu và Bubu vẫy tay -->
      <img id="bubuGif" src="https://media.tenor.com/J332S3sHlhUAAAAC/bubu-dudu-bubu.gif" alt="Bubu Dudu">
    </div>

    <button id="hugBtn" class="btn-action" onclick="startHug()">Ấn để Dudu ôm Bubu 🐾</button>

    <!-- Ô gửi lời nhắn -->
    <div id="messageForm" class="message-form">
      <input type="text" id="noteInput" class="message-input" placeholder="Để lại lời nhắn yêu thương..." maxlength="50">
      <button class="btn-action" style="background-color: #2a9d8f;" onclick="saveNote()">Gửi lời nhắn ✨</button>
    </div>
  </div>

  <script>
    // 1. Hàm kích hoạt cảnh Dudu chạy tới ôm Bubu
    function startHug() {
      const gifImg = document.getElementById('bubuGif');
      const hugBtn = document.getElementById('hugBtn');
      const messageForm = document.getElementById('messageForm');

      // Đổi sang GIF Dudu chạy tới ôm Bubu ấm áp
      gifImg.src = "https://media.tenor.com/2X88v6E1E4AAAAAC/bubu-dudu-hug.gif";
      
      // Ẩn nút ôm và hiện ô nhập lời nhắn
      hugBtn.style.display = 'none';
      setTimeout(() => {
        messageForm.style.display = 'flex';
      }, 600);
    }

    // 2. Hàm lưu lời nhắn và tạo hiệu ứng bay
    function saveNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();

      if (text !== "") {
        let notes = JSON.parse(localStorage.getItem('bubu_notes')) || [];
        notes.push(text);
        localStorage.setItem('bubu_notes', JSON.stringify(notes));

        // Tạo phần tử tin nhắn bay ngay lập tức
        createFloatingNote(text);
        input.value = '';
      }
    }

    // 3. Hàm tạo một tin nhắn bay lơ lửng ngẫu nhiên trên màn hình
    function createFloatingNote(text) {
      const note = document.createElement('div');
      note.className = 'floating-note';
      note.innerText = '💌 ' + text;

      // Vị trí ngẫu nhiên trên màn hình
      const randomTop = Math.floor(Math.random() * (window.innerHeight - 100)) + 20;
      const randomLeft = Math.floor(Math.random() * (window.innerWidth - 150)) + 20;
      const randomDuration = Math.floor(Math.random() * 6) + 8; // Từ 8s - 14s

      note.style.top = randomTop + 'px';
      note.style.left = randomLeft + 'px';
      note.style.animationDuration = randomDuration + 's';

      document.body.appendChild(note);
    }

    // 4. Khi tải/vào lại trang: Hiển thị lại tất cả lời nhắn cũ bay trên màn hình
    window.onload = function() {
      let notes = JSON.parse(localStorage.getItem('bubu_notes')) || [];
      notes.forEach(text => {
        createFloatingNote(text);
      });
    };
  </script>
</body>
</html>
