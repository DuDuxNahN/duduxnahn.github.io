<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Bubu & Dudu Hugs 🐾</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background-color: #fceade;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    button {
      font-family: inherit;
    }

    /* ============ MÀN HÌNH CHÍNH ============ */
    .scene-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      border: 3px solid #f4a261;
      width: 320px;
      max-width: 92vw;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .gif-box {
      width: 130px;
      height: 130px;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gif-box img {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    .btn-action {
      background-color: #e76f51;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(231, 111, 81, 0.4);
      width: 100%;
      transition: 0.2s;
      margin-top: 5px;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .together-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #e76f51;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(231, 111, 81, 0.4);
      z-index: 100;
      transition: 0.2s;
    }

    .together-btn:active {
      transform: scale(0.95);
    }

    /* ============ KHUNG CHAT (TOÀN MÀN HÌNH, THEO BÀN PHÍM) ============ */
    .chat-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      z-index: 200;
      background: #fceade;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-overlay.open {
      display: flex;
    }

    .chat-header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: #e76f51;
      color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .chat-back {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 8px;
    }

    .chat-title {
      flex: 1;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .me-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      padding: 2px;
    }

    .me-switch button {
      border: none;
      background: none;
      color: white;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 5px 11px;
      border-radius: 50px;
      cursor: pointer;
    }

    .me-switch button.active {
      background: white;
      color: #e76f51;
    }

    /* Màn nhập mật khẩu */
    .pin-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 20px;
    }

    .pin-title {
      font-weight: bold;
      color: #333;
      font-size: 1rem;
    }

    .pin-hint {
      font-size: 0.82rem;
      color: #b08968;
    }

    .pin-input {
      width: 150px;
      padding: 10px;
      border: 2px solid #f4a261;
      border-radius: 12px;
      outline: none;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 0.5rem;
      text-indent: 0.5rem;
      font-family: inherit;
      background: white;
    }

    .pin-input:focus {
      border-color: #e76f51;
    }

    .pin-error {
      min-height: 1.1em;
      font-size: 0.82rem;
      font-weight: bold;
      color: #e76f51;
    }

    .pin-shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Vùng tin nhắn */
    .chat-body {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    .chat-body.open {
      display: flex;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-empty {
      margin: auto;
      text-align: center;
      color: #b08968;
      font-size: 0.9rem;
    }

    .day-divider {
      align-self: center;
      margin: 10px 0 6px;
      padding: 3px 12px;
      border-radius: 50px;
      background: rgba(244, 162, 97, 0.28);
      color: #9c5a2e;
      font-size: 0.72rem;
      font-weight: bold;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .msg-row.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.theirs {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 0.7rem;
      color: #b08968;
      margin: 4px 8px 1px;
    }

    .bubble {
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mine .bubble {
      background: #e76f51;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .theirs .bubble {
      background: white;
      color: #333;
      border: 1.5px solid #f4a261;
      border-bottom-left-radius: 5px;
    }

    .bubble img, .bubble video {
      max-width: 220px;
      max-height: 260px;
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      display: block;
    }

    .msg-meta {
      font-size: 0.68rem;
      color: #b08968;
      margin: 2px 8px 0;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .msg-delete {
      background: none;
      border: none;
      color: #e76f51;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .msg-row.show-actions .msg-delete {
      display: inline;
    }

    /* Thanh nhập kiểu app chat (luôn nằm sát đáy khung, ngay trên bàn phím) */
    .chat-composer {
      flex: none;
      padding: 8px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: #fff6ef;
      border-top: 1px solid rgba(244, 162, 97, 0.4);
    }

    .attach-preview {
      display: none;
      align-items: center;
      gap: 8px;
      background: white;
      border: 1.5px dashed #f4a261;
      border-radius: 12px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: #9c5a2e;
    }

    .attach-preview.show {
      display: flex;
    }

    .attach-preview span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attach-preview button {
      background: none;
      border: none;
      color: #e76f51;
      font-size: 1rem;
      cursor: pointer;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .icon-btn {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #fff0e6;
      color: #e76f51;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .composer-field {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: white;
      border: 2px solid #f4a261;
      border-radius: 22px;
      padding: 0 6px 0 14px;
      min-width: 0;
    }

    .composer-field:focus-within {
      border-color: #e76f51;
    }

    .chat-input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 16px; /* >=16px để iOS không tự phóng to trang */
      line-height: 1.3;
      padding: 9px 0;
      max-height: 110px;
      background: none;
      min-width: 0;
    }

    .time-pill {
      flex: none;
      align-self: center;
      border: none;
      background: #fff0e6;
      color: #e76f51;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 5px 9px;
      border-radius: 50px;
      cursor: pointer;
      white-space: nowrap;
    }

    .send-btn {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #2a9d8f;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(42, 157, 143, 0.4);
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    @media (prefers-reduced-motion: reduce) {
      .pin-shake { animation: none; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Màn hình chính -->
  <div class="scene-container">
    <div class="gif-box">
      <img id="bubuGif" src="bubu1.gif" alt="">
    </div>
    <button id="chatBtn" class="btn-action" onclick="openChat()">Ấn để chat với nhà gấu 🐾</button>
  </div>

  <!-- Khung chat toàn màn hình -->
  <div id="chatOverlay" class="chat-overlay">
    <div class="chat-header">
      <button class="chat-back" onclick="closeChat()" aria-label="Quay lại">‹</button>
      <div class="chat-title">Bubu & Dudu 💕</div>
      <div id="meSwitch" class="me-switch" style="display: none;">
        <button data-me="Bubu" onclick="setMe('Bubu')">Bubu</button>
        <button data-me="Dudu" onclick="setMe('Dudu')">Dudu</button>
      </div>
    </div>

    <!-- Nhập mật khẩu -->
    <div id="pinPanel" class="pin-panel">
      <div class="pin-title">Nhập mật khẩu 4 số</div>
      <div class="pin-hint">Gợi ý: sinh nhật của BuBu 🎂</div>
      <input type="password" id="pinInput" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
      <div id="pinError" class="pin-error"></div>
    </div>

    <!-- Nội dung chat (chỉ hiện sau khi mở khóa) -->
    <div id="chatBody" class="chat-body">
      <div id="chatMessages" class="chat-messages"></div>

      <div class="chat-composer">
        <div id="attachPreview" class="attach-preview">
          <span id="attachName"></span>
          <button onpointerdown="event.preventDefault()" onclick="clearAttachment()" aria-label="Bỏ tệp">✕</button>
        </div>
        <div class="composer-row">
          <button class="icon-btn" onclick="document.getElementById('mediaFile').click()" aria-label="Đính kèm ảnh hoặc video">📎</button>
          <input type="file" id="mediaFile" accept="image/*,video/*" style="display: none;">
          <div class="composer-field">
            <textarea id="chatInput" class="chat-input" rows="1" placeholder="Nhắn gì đó..." maxlength="500"></textarea>
            <button id="timePill" class="time-pill" onpointerdown="event.preventDefault()" onclick="toggleDuration()" title="Thời gian hiển thị">⏳ 24 giờ</button>
          </div>
          <button class="send-btn" onpointerdown="event.preventDefault()" onclick="sendMessage()" aria-label="Gửi">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABW8qlALzqJXB5GYReEz2gMFmIMHzHXBM",
      authDomain: "budu-note.firebaseapp.com",
      databaseURL: "https://budu-note-default-rtdb.firebaseio.com",
      projectId: "budu-note",
      storageBucket: "budu-note.firebasestorage.app",
      messagingSenderId: "751175174116",
      appId: "1:751175174116:web:13ceee8e30b1d22a0469f1"
    };

    // Nếu Firebase bị chặn / không tải được thì trang vẫn chạy, chỉ báo lỗi trong khung chat
    let firebaseOk = true;
    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (err) {
      console.error('Firebase lỗi:', err);
      firebaseOk = false;
      const noop = function() { return ref; };
      const ref = { push: noop, on: noop, remove: noop, child: noop };
      db = { ref: function() { return ref; } };
    }

    const PERMANENT = -1;
    const DEFAULT_LIFETIME = 24 * 3600 * 1000; // 24 giờ

    /* ================= KHUNG CHAT THEO BÀN PHÍM ================= */
    // Khi bàn phím bật lên, co khung chat đúng bằng phần màn hình còn trống
    // để ô nhập luôn nằm ngay trên bàn phím và không bị che.
    function syncViewport() {
      const overlay = document.getElementById('chatOverlay');
      if (!overlay.classList.contains('open')) return;
      const vv = window.visualViewport;
      if (!vv) return;

      overlay.style.height = vv.height + 'px';
      overlay.style.top = vv.offsetTop + 'px';
      window.scrollTo(0, 0);

      const box = document.getElementById('chatMessages');
      box.scrollTop = box.scrollHeight;
    }

    function resetViewport() {
      const overlay = document.getElementById('chatOverlay');
      overlay.style.height = '';
      overlay.style.top = '';
    }

    if (window.visualViewport) {
      visualViewport.addEventListener('resize', syncViewport);
      visualViewport.addEventListener('scroll', syncViewport);
    }

    document.getElementById('chatInput').addEventListener('focus', function() {
      setTimeout(syncViewport, 300);
    });

    document.getElementById('pinInput').addEventListener('focus', function() {
      setTimeout(syncViewport, 300);
    });

    /* ================= MẬT KHẨU 4 SỐ ================= */
    // Mật khẩu KHÔNG nằm trong code, chỉ có mã băm (SHA-256 + salt).
    const PIN_SALT = 'bubu-dudu-salt-v1';
    const PIN_HASH = 'e52970b369047515d3dd25be5bdcd9bd10e0cfec7801248c9d7de596ff2df504';
    const PIN_HASH_FALLBACK = 'fdece82f7'; // dùng khi trình duyệt không hỗ trợ SHA-256

    let chatUnlocked = false;
    let chatListenerStarted = false;

    async function hashPin(pin) {
      const data = PIN_SALT + ':' + pin;
      if (window.crypto && window.crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h = 5381;
      for (let i = 0; i < data.length; i++) h = ((h * 33) ^ data.charCodeAt(i)) >>> 0;
      return 'f' + h.toString(16);
    }

    function showPinError(msg) {
      const input = document.getElementById('pinInput');
      document.getElementById('pinError').textContent = msg;
      input.value = '';
      input.classList.remove('pin-shake');
      void input.offsetWidth;
      input.classList.add('pin-shake');
    }

    function showPinScreen() {
      chatUnlocked = false;
      document.getElementById('pinPanel').style.display = 'flex';
      document.getElementById('chatBody').classList.remove('open');
      document.getElementById('meSwitch').style.display = 'none';
      document.getElementById('pinError').textContent = '';
      const input = document.getElementById('pinInput');
      input.value = '';
      setTimeout(() => input.focus(), 50);
    }

    function unlockChat() {
      chatUnlocked = true;
      document.getElementById('pinPanel').style.display = 'none';
      document.getElementById('chatBody').classList.add('open');
      document.getElementById('meSwitch').style.display = 'flex';
      document.getElementById('pinInput').blur();

      // Mỗi bước chạy riêng, lỗi ở một bước không chặn việc vào chat
      try { applyMe(); } catch (err) { console.error(err); }
      try { scheduleRender(true); } catch (err) { console.error(err); }
      try { startChatListener(); } catch (err) { console.error(err); }

      // Đợi bàn phím đóng xong rồi mới chỉnh lại kích thước khung
      setTimeout(function() {
        resetViewport();
        syncViewport();
      }, 350);
    }

    function openChat() {
      document.getElementById('chatOverlay').classList.add('open');
      if (!chatUnlocked) showPinScreen();
      syncViewport();
    }

    function closeChat() {
      document.getElementById('chatInput').blur();
      document.getElementById('chatOverlay').classList.remove('open');
      resetViewport();
      // Đóng chat thì khóa lại
      showPinScreen();
      document.getElementById('pinInput').blur();
    }

    document.getElementById('pinInput').addEventListener('input', async function(e) {
      // Chỉ cho nhập số, tối đa 4 số
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (e.target.value.length === 4) {
        let h = '';
        try {
          h = await hashPin(e.target.value);
        } catch (err) {
          console.error(err);
          showPinError('Lỗi kiểm tra mật khẩu, tải lại trang nhé');
          return;
        }
        if (h === PIN_HASH || h === PIN_HASH_FALLBACK) {
          unlockChat();
        } else {
          showPinError('Sai mật khẩu, thử lại nhé');
        }
      }
    });

    /* ================= NGƯỜI GỬI (Bubu / Dudu) ================= */
    let me = 'Bubu';
    try {
      const saved = localStorage.getItem('bubuChatMe');
      if (saved === 'Bubu' || saved === 'Dudu') me = saved;
    } catch (err) {}

    function applyMe() {
      document.querySelectorAll('#meSwitch button').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.me === me);
      });
    }

    function setMe(name) {
      me = name;
      try { localStorage.setItem('bubuChatMe', name); } catch (err) {}
      applyMe();
      scheduleRender(false);
    }

    /* ================= THỜI GIAN HIỂN THỊ (24 giờ / vĩnh viễn) ================= */
    let permanentMode = false;

    function toggleDuration() {
      permanentMode = !permanentMode;
      document.getElementById('timePill').textContent = permanentMode ? '♾️ Vĩnh viễn' : '⏳ 24 giờ';
    }

    /* ================= ĐÍNH KÈM ẢNH / VIDEO ================= */
    const mediaFile = document.getElementById('mediaFile');

    mediaFile.addEventListener('change', function() {
      const file = mediaFile.files[0];
      const preview = document.getElementById('attachPreview');
      if (file) {
        document.getElementById('attachName').textContent = (file.type.startsWith('video') ? '🎬 ' : '🖼️ ') + file.name;
        preview.classList.add('show');
      } else {
        preview.classList.remove('show');
      }
    });

    function clearAttachment() {
      mediaFile.value = '';
      document.getElementById('attachPreview').classList.remove('show');
    }

    /* ================= GỬI TIN NHẮN ================= */
    const chatInput = document.getElementById('chatInput');

    function autoGrow() {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px';
    }

    chatInput.addEventListener('input', autoGrow);

    // Enter để gửi, Shift+Enter để xuống dòng
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendMessage() {
      const text = chatInput.value.trim();
      const file = mediaFile.files[0];
      const duration = permanentMode ? PERMANENT : DEFAULT_LIFETIME;

      if (!text && !file) return;

      const base = {
        sender: me,
        timestamp: Date.now(),
        duration: duration
      };
      if (text) base.text = text;

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base.mediaUrl = e.target.result;
          base.mediaType = file.type.startsWith('video') ? 'video' : 'image';
          db.ref('notes').push(base);
        };
        reader.readAsDataURL(file);
      } else {
        db.ref('notes').push(base);
      }

      chatInput.value = '';
      autoGrow();
      clearAttachment();
      // Giữ bàn phím mở để nhắn tiếp
      chatInput.focus();
    }

    /* ================= HIỂN THỊ ĐOẠN CHAT ================= */
    const messages = new Map(); // id -> dữ liệu
    let renderQueued = false;
    let forceScroll = false;

    function isExpired(data) {
      if (data.duration === PERMANENT) return false;
      const life = data.duration || DEFAULT_LIFETIME;
      return (data.timestamp || 0) + life <= Date.now();
    }

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function timeLabel(ts) {
      const d = new Date(ts);
      return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    function dayLabel(ts) {
      const d = new Date(ts);
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      const key = d.toDateString();
      if (key === today.toDateString()) return 'Hôm nay';
      if (key === yesterday.toDateString()) return 'Hôm qua';
      return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
    }

    function startChatListener() {
      if (chatListenerStarted) return;
      chatListenerStarted = true;

      const ref = db.ref('notes');

      ref.on('child_added', function(snap) {
        const data = snap.val();
        if (!data || !(data.text || data.mediaUrl)) return;
        if (isExpired(data)) {
          ref.child(snap.key).remove();
          return;
        }
        messages.set(snap.key, data);
        scheduleRender(true);
      });

      ref.on('child_removed', function(snap) {
        messages.delete(snap.key);
        scheduleRender(false);
      });
    }

    // Dọn tin nhắn hết hạn mỗi 30 giây
    setInterval(function() {
      let changed = false;
      messages.forEach(function(data, id) {
        if (isExpired(data)) {
          messages.delete(id);
          db.ref('notes/' + id).remove();
          changed = true;
        }
      });
      if (changed) scheduleRender(false);
    }, 30000);

    function scheduleRender(scrollDown) {
      if (scrollDown) forceScroll = true;
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(function() {
        renderQueued = false;
        renderChat();
      });
    }

    function renderChat() {
      const box = document.getElementById('chatMessages');
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      const shouldScroll = forceScroll || nearBottom;
      forceScroll = false;

      box.innerHTML = '';

      const list = Array.from(messages.entries())
        .map(function(entry) { return { id: entry[0], data: entry[1] }; })
        .sort(function(a, b) { return (a.data.timestamp || 0) - (b.data.timestamp || 0); });

      if (list.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'chat-empty';
        empty.textContent = firebaseOk
          ? 'Chưa có tin nhắn nào. Nhắn gì đó đi nè 💌'
          : 'Không kết nối được máy chủ tin nhắn. Hãy tắt Brave Shields cho trang này (biểu tượng sư tử cạnh thanh địa chỉ) rồi tải lại trang nhé.';
        box.appendChild(empty);
        return;
      }

      let lastDay = '';
      let lastSender = null;

      list.forEach(function(item) {
        const data = item.data;
        const ts = data.timestamp || Date.now();
        const day = new Date(ts).toDateString();

        if (day !== lastDay) {
          const divider = document.createElement('div');
          divider.className = 'day-divider';
          divider.textContent = dayLabel(ts);
          box.appendChild(divider);
          lastDay = day;
          lastSender = null;
        }

        const mine = data.sender === me;
        const row = document.createElement('div');
        row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');

        if (!mine && data.sender && data.sender !== lastSender) {
          const name = document.createElement('div');
          name.className = 'msg-sender';
          name.textContent = data.sender;
          row.appendChild(name);
        }
        lastSender = data.sender || null;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (data.mediaUrl) {
          if (data.mediaType === 'video') {
            const v = document.createElement('video');
            v.src = data.mediaUrl;
            v.controls = true;
            v.playsInline = true;
            v.muted = true;
            bubble.appendChild(v);
          } else {
            const img = document.createElement('img');
            img.src = data.mediaUrl;
            img.alt = 'Ảnh';
            bubble.appendChild(img);
          }
        }
        if (data.text) {
          const t = document.createElement('span');
          t.textContent = data.text;
          bubble.appendChild(t);
        }

        const meta = document.createElement('div');
        meta.className = 'msg-meta';

        const time = document.createElement('span');
        time.textContent = timeLabel(ts) + (data.duration === PERMANENT ? ' · ♾️' : '');
        meta.appendChild(time);

        const del = document.createElement('button');
        del.className = 'msg-delete';
        del.textContent = 'Xóa';
        del.addEventListener('click', function(e) {
          e.stopPropagation();
          if (confirm('Xóa tin nhắn này nhé? 💕')) {
            db.ref('notes/' + item.id).remove();
          }
        });
        meta.appendChild(del);

        // Chạm vào tin nhắn để hiện nút Xóa
        bubble.addEventListener('click', function() {
          row.classList.toggle('show-actions');
        });

        row.appendChild(bubble);
        row.appendChild(meta);
        box.appendChild(row);
      });

      if (shouldScroll) {
        box.scrollTop = box.scrollHeight;
      }
    }
  </script>
</body>
</html>
