<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Bubu & Dudu Hugs 🐾 (v4.11)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4ec 50%, #fceade 100%);
      font-family: 'Quicksand', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    button {
      font-family: inherit;
    }

    /* ============ MÀN HÌNH CHÍNH ============ */
    .scene-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 18px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 117, 143, 0.18);
      border: 2.5px solid #ffb3c6;
      width: 320px;
      max-width: 92vw;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .gif-box {
      width: 130px;
      height: 130px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gif-box img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
    }

    .btn-action {
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: white;
      border: none;
      padding: 11px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.35);
      width: 100%;
      transition: 0.2s;
      margin-top: 5px;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    .version-tag {
      font-size: 0.72rem;
      color: #c9184a;
      opacity: 0.7;
      margin-top: 8px;
      font-weight: 700;
    }

    /* ============ NÚT 'T' Ở GÓC DƯỚI ============ */
    .btn-t-corner {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: rgba(255, 179, 198, 0.55);
      color: #a4133c;
      border: 1px solid #ff8fa3;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .btn-t-corner:active {
      transform: scale(0.9);
      background-color: #ff4d6d;
      color: white;
    }

    /* ============ POPUP XEM LOG ============ */
    .log-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: rgba(89, 13, 34, 0.35);
      backdrop-filter: blur(3px);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }

    .log-modal.open {
      display: flex;
    }

    .log-card {
      background: white;
      border-radius: 22px;
      padding: 16px;
      width: 320px;
      max-width: 90vw;
      border: 2.5px solid #ffb3c6;
      box-shadow: 0 10px 30px rgba(164, 19, 60, 0.18);
      position: relative;
    }

    .log-card-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 8px;
    }

    .log-card-header.has-title {
      justify-content: space-between;
    }

    .log-card-title {
      font-weight: bold;
      font-size: 1rem;
      color: #ff4d6d;
      display: none;
    }

    .log-card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-clear-logs {
      background: none;
      border: none;
      color: #ff4d6d;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .btn-clear-logs:active {
      opacity: 0.7;
    }

    .log-card-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #c9184a;
      cursor: pointer;
    }

    .log-pin-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
    }

    .log-pin-input {
      width: 130px;
      padding: 8px;
      border: 2px solid #ffb3c6;
      border-radius: 12px;
      outline: none;
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 0.4rem;
      text-indent: 0.4rem;
      font-family: inherit;
    }

    .log-pin-error {
      font-size: 0.78rem;
      color: #ff4d6d;
      font-weight: bold;
      min-height: 1.1em;
    }

    .log-content {
      display: none;
      max-height: 250px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.78rem;
    }

    .log-content.show {
      display: block;
    }

    .log-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 179, 198, 0.4);
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-time {
      font-weight: bold;
      color: #ff4d6d;
      font-size: 0.72rem;
    }
    .log-delete-btn {
      background: none;
      border: none;
      color: #a4133c;
      font-size: 0.72rem;
      cursor: pointer;
      float: right;
      padding: 0;
      font-weight: normal;
    }
    .log-delete-btn:active {
      opacity: 0.7;
    }

    .log-device {
      color: #2a9d8f;
      font-weight: bold;
    }

    .log-os {
      color: #264653;
      font-size: 0.74rem;
      display: block;
      margin-top: 2px;
    }

    .log-location {
      color: #d97706;
      font-size: 0.75rem;
      display: block;
      margin-top: 2px;
    }

    .log-status-viewed {
      display: inline-block;
      background-color: #ff4d6d;
      color: white;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .log-duration {
      font-size: 0.72rem;
      color: #d97706;
      font-weight: bold;
      margin-top: 3px;
      padding-left: 2px;
    }

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-overlay.open {
      display: flex;
    }

    /* Họa tiết trái tim bay nhẹ phía sau khung chat */
    .chat-bg-hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      bottom: -24px;
      font-size: 16px;
      opacity: 0;
      animation: floatHeart 9s ease-in infinite;
    }

    @keyframes floatHeart {
      0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
      15% { opacity: 0.45; }
      85% { opacity: 0.25; }
      100% { transform: translateY(-105vh) scale(1.2) rotate(18deg); opacity: 0; }
    }

    .chat-header {
      flex: none;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      padding-top: max(11px, env(safe-area-inset-top));
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(255, 77, 109, 0.25);
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
    }

    .chat-back {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .chat-back:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.35);
    }

    .chat-title-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-title {
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.15;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pulse-heart {
      display: inline-block;
      animation: heartBeat 1.4s infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.22); }
      50% { transform: scale(0.95); }
      75% { transform: scale(1.15); }
    }

    .chat-subtitle {
      font-size: 0.7rem;
      opacity: 0.92;
      margin-top: 2px;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-clear-all {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .btn-clear-all:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .me-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50px;
      padding: 2px;
    }

    .me-switch button {
      border: none;
      background: none;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
    }

    .me-switch button.active {
      background: white;
      color: #ff4d6d;
      box-shadow: 0 2px 6px rgba(164, 19, 60, 0.2);
    }

    /* Màn nhập mật khẩu chat */
    .pin-panel {
      flex: 1;
      min-height: 0;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 20px;
    }

    .pin-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 24px 22px;
      border-radius: 26px;
      border: 2px solid #ffb3c6;
      box-shadow: 0 12px 32px rgba(255, 77, 109, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 300px;
      width: 100%;
    }

    .pin-icon {
      font-size: 2rem;
      margin-bottom: 2px;
    }

    .pin-title {
      font-weight: 700;
      color: #800f2f;
      font-size: 1.05rem;
    }

    .pin-hint {
      font-size: 0.82rem;
      color: #c9184a;
      font-weight: 600;
    }

    .pin-input {
      width: 156px;
      padding: 10px;
      border: 2px solid #ff8fa3;
      border-radius: 16px;
      outline: none;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 0.5rem;
      text-indent: 0.5rem;
      font-family: inherit;
      background: #fff8fa;
      color: #ff4d6d;
      margin-top: 4px;
    }

    .pin-input:focus {
      border-color: #ff4d6d;
      box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.15);
    }

    .pin-error {
      min-height: 1.1em;
      font-size: 0.82rem;
      font-weight: 700;
      color: #ff4d6d;
    }

    .pin-shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Vùng tin nhắn */
    .chat-body {
      flex: 1;
      position: relative;
      z-index: 2;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    .chat-body.open {
      display: flex;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-empty {
      margin: auto;
      text-align: center;
      color: #c9184a;
      font-size: 0.92rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.75);
      padding: 14px 20px;
      border-radius: 20px;
      border: 1.5px dashed #ffb3c6;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: msgFadeIn 0.25s ease-out;
    }

    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.theirs {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 0.72rem;
      font-weight: 700;
      color: #a4133c;
      margin: 4px 10px 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 0.94rem;
      line-height: 1.42;
      word-break: break-word;
      white-space: pre-wrap;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    /* Bong bóng tin nhắn của mình (Hồng dâu ngọt ngào) */
    .mine .bubble {
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(255, 77, 109, 0.24);
    }

    /* Bong bóng tin nhắn của người thương (Trắng kem viền hồng phấn) */
    .theirs .bubble {
      background: rgba(255, 255, 255, 0.95);
      color: #4a1525;
      border: 1.5px solid #ffb3c6;
      border-bottom-left-radius: 6px;
      box-shadow: 0 4px 12px rgba(255, 143, 163, 0.14);
    }

    .bubble img, .bubble video {
      max-width: 220px;
      max-height: 260px;
      width: 100%;
      border-radius: 14px;
      object-fit: cover;
      display: block;
    }

    .msg-meta {
      font-size: 0.67rem;
      color: #b56576;
      margin: 3px 10px 0;
      display: flex;
      gap: 6px;
      align-items: center;
      font-weight: 600;
    }

    .msg-delete {
      background: none;
      border: none;
      color: #ff4d6d;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      opacity: 0.8;
    }

    .msg-delete:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .msg-row.show-actions .msg-delete {
      display: inline;
    }

    /* Thanh nhập tin nhắn */
    .chat-composer {
      flex: none;
      padding: 8px 10px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-top: 1.5px solid rgba(255, 179, 198, 0.6);
    }

    .attach-preview {
      display: none;
      align-items: center;
      gap: 8px;
      background: #fff0f5;
      border: 1.5px dashed #ff758f;
      border-radius: 14px;
      padding: 6px 12px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: #a4133c;
      font-weight: 600;
    }

    .attach-preview.show {
      display: flex;
    }

    .attach-preview span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attach-preview button {
      background: none;
      border: none;
      color: #ff4d6d;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .icon-btn {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid #ffb3c6;
      background: #fff0f5;
      color: #ff4d6d;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: #ffe0ea;
    }

    .composer-field {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: #fff8fa;
      border: 1.8px solid #ffb3c6;
      border-radius: 22px;
      padding: 0 14px;
      min-width: 0;
      transition: 0.2s;
    }

    .composer-field:focus-within {
      border-color: #ff4d6d;
      background: white;
      box-shadow: 0 0 0 3px rgba(255, 117, 143, 0.15);
    }

    .chat-input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 15.5px;
      line-height: 1.35;
      padding: 9px 0;
      max-height: 140px;
      background: none;
      min-width: 0;

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABW8qlALzqJXB5GYReEz2gMFmIMHzHXBM",
      authDomain: "budu-note.firebaseapp.com",
      databaseURL: "https://budu-note-default-rtdb.firebaseio.com",
      projectId: "budu-note",
      storageBucket: "budu-note.firebasestorage.app",
      messagingSenderId: "751175174116",
      appId: "1:751175174116:web:13ceee8e30b1d22a0469f1"
    };

    let firebaseOk = true;
    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (err) {
      console.error('Firebase lỗi:', err);
      firebaseOk = false;
      const noop = function() { return ref; };
      const ref = { push: noop, on: noop, remove: noop, child: noop, update: noop, set: noop };
      db = { ref: function() { return ref; } };
    }

    /* ============ MẬT KHẨU LOG (0803) & HÀM BĂM SHA-256 ============ */
    const PIN_SALT = 'bubu-dudu-salt-v1';
    
    async function hashPin(pin) {
      const data = PIN_SALT + ':' + pin;
      if (window.crypto && window.crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h = 5381;
      for (let i = 0; i < data.length; i++) h = ((h * 33) ^ data.charCodeAt(i)) >>> 0;
      return 'f' + h.toString(16);
    }

    const LOG_PIN_HASH = 'ef499a560d7ac0a21c2c11d3398d605f2ad536e310c2914cad3a50b7771e4ab1';
    const LOG_PIN_HASH_FALLBACK = 'fdecdd054';

    /* ============ LOGIC GHI LOG TRUY CẬP & THỜI GIAN Ở LẠI ============ */
    const DEVICE_MODELS = {
      '22071212AG': 'Xiaomi 12T',
      '22081212UG': 'Xiaomi 12T Pro',
      '23078PND5G': 'Xiaomi 13T',
      '2306EPN60G': 'Xiaomi 13T Pro',
      '2406APNFAG': 'Xiaomi 14T',
      '2407FPN8EG': 'Xiaomi 14T Pro',
      '2201123G': 'Xiaomi 12',
      '2211133G': 'Xiaomi 13',
      '23127PN0CG': 'Xiaomi 14',
      'SM-S911B': 'Samsung Galaxy S23',
      'SM-S918B': 'Samsung Galaxy S23 Ultra',
      'SM-S921B': 'Samsung Galaxy S24',
      'SM-S928B': 'Samsung Galaxy S24 Ultra',
      'SM-A546E': 'Samsung Galaxy A54',
      'SM-A556E': 'Samsung Galaxy A55'
    };

    function getScreenSignature() {
      const w = Math.min(window.screen.width, window.screen.height);
      const h = Math.max(window.screen.width, window.screen.height);
      const dpr = window.devicePixelRatio || 1;
      return `${w}x${h}@${dpr}`;
    }

    function guessIPhoneModel() {
      const res = getScreenSignature();
      const iosMap = {
        '375x667@2': 'iPhone SE / 6s / 7 / 8',
        '414x736@3': 'iPhone 6s+ / 7+ / 8+',
        '375x812@3': 'iPhone X / XS / 11 Pro / 12 mini / 13 mini',
        '414x896@2': 'iPhone XR / 11',
        '414x896@3': 'iPhone XS Max / 11 Pro Max',
        '390x844@3': 'iPhone 12 / 12 Pro / 13 / 13 Pro / 14',
        '428x926@3': 'iPhone 12 Pro Max / 13 Pro Max / 14 Plus',
        '393x852@3': 'iPhone 14 Pro / 15 / 15 Pro / 16',
        '430x932@3': 'iPhone 14 Pro Max / 15 Plus / 15 Pro Max / 16 Plus',
        '402x874@3': 'iPhone 16 Pro',
        '440x956@3': 'iPhone 16 Pro Max'
      };
      return iosMap[res] || 'iPhone';
    }

    function matchVersion(ua, re) {
      const m = ua.match(re);
      return m ? m[1] : '';
    }

    async function detectDeviceInfo() {
      const ua = navigator.userAgent || '';
      const platform = navigator.platform || '';
      const screenSig = getScreenSignature();
      let deviceName = 'Thiết bị không rõ';
      let browser = 'Trình duyệt khác';
      let browserVersion = '';
      let osInfo = 'Hệ điều hành không rõ';
      let rawModel = '';
      const isChromium = /Chrome\/|CriOS\//i.test(ua);

      let uaHints = {};
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        try {
          uaHints = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion']);
        } catch (e) {}
      }
      const hintPlatform = uaHints.platform || (navigator.userAgentData && navigator.userAgentData.platform) || '';

      if (/iPhone/i.test(ua)) {
        deviceName = guessIPhoneModel();
        const iosMatch = ua.match(/OS\s+([\d_]+)/i);
        osInfo = iosMatch ? `iOS ${iosMatch[1].replace(/_/g, '.')}` : 'iOS';
      } else if (/iPad/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) {
        deviceName = 'iPad';
        const iosMatch = ua.match(/OS\s+([\d_]+)/i);
        // iPadOS dạng "Macintosh" luôn báo 10_15_7 nên không đáng tin
        osInfo = (iosMatch && /iPad/i.test(ua)) ? `iPadOS ${iosMatch[1].replace(/_/g, '.')}` : 'iPadOS';
      } else if (/Android/i.test(ua) || /Android/i.test(hintPlatform)) {
        let model = (uaHints.model || '').trim();
        if (!model) {
          const match = ua.match(/Android[^;]*;\s*([^)]+)\)/i);
          if (match && match[1]) {
            model = match[1].replace(/Build\/.*$/i, '').replace(/;\s*wv\s*$/i, '').trim();
          }
        }
        model = model.split(';')[0].trim();
        if (model === 'K' || /^(Mobile|Tablet)$/i.test(model)) model = '';
        rawModel = model;
        if (model) {
          deviceName = DEVICE_MODELS[model] ? `${DEVICE_MODELS[model]} (${model})` : `Android (${model})`;
        } else {
          deviceName = 'Điện thoại Android';
        }

        // Chromium đóng băng UA ở "Android 10" nên chỉ tin platformVersion
        let androidVer = '';
        if (uaHints.platformVersion) {
          androidVer = uaHints.platformVersion.split('.')[0];
        } else if (!isChromium) {
          androidVer = matchVersion(ua, /Android\s+([\d.]+)/i);
        }
        osInfo = androidVer ? `Android ${androidVer}` : 'Android (không rõ phiên bản)';
      } else if (/CrOS/i.test(ua) || /Chrome OS/i.test(hintPlatform)) {
        deviceName = 'Chromebook';
        osInfo = 'ChromeOS';
      } else if (/Windows/i.test(ua) || /Windows/i.test(hintPlatform) || /^Win/i.test(platform)) {
        deviceName = 'Windows PC';
        if (uaHints.platformVersion) {
          const major = parseInt(uaHints.platformVersion.split('.')[0], 10);
          osInfo = major >= 13 ? 'Windows 11' : (major > 0 ? 'Windows 10' : 'Windows');
        } else if (/Windows NT 10\.0/i.test(ua)) {
          osInfo = 'Windows 10/11';
        } else if (/Windows NT 6\.3/i.test(ua)) {
          osInfo = 'Windows 8.1';
        } else if (/Windows NT 6\.1/i.test(ua)) {
          osInfo = 'Windows 7';
        } else {
          osInfo = 'Windows';
        }
      } else if (/Macintosh/i.test(ua) || /macOS/i.test(hintPlatform) || /^Mac/i.test(platform)) {
        deviceName = 'MacBook / iMac (macOS)';
        // UA luôn báo 10_15_7 nên chỉ tin platformVersion
        if (uaHints.platformVersion) {
          const p = uaHints.platformVersion.split('.');
          osInfo = `macOS ${p[0]}${p[1] ? '.' + p[1] : ''}`;
        } else {
          osInfo = 'macOS (không rõ phiên bản)';
        }
      } else if (/Linux|X11/i.test(ua) || /Linux/i.test(hintPlatform) || /Linux/i.test(platform)) {
        deviceName = 'Linux PC';
        osInfo = 'Linux';
      } else if (/iPhone|iPad|iPod/i.test(platform)) {
        deviceName = 'Thiết bị Apple';
        osInfo = 'iOS / iPadOS';
      }

      let isBrave = false;
      if (navigator.brave && typeof navigator.brave.isBrave === 'function') {
        try {
          isBrave = await navigator.brave.isBrave();
        } catch (e) {}
      }

      if (/MESSENGER|Orca-Android|FBMD/i.test(ua) && /FB_IAB|FBAN|FBAV/i.test(ua)) { browser = 'Messenger App'; }
      else if (/FBAN|FBAV|FB_IAB/i.test(ua)) { browser = 'Facebook App'; }
      else if (/Zalo/i.test(ua)) { browser = 'Zalo App'; }
      else if (/Instagram/i.test(ua)) { browser = 'Instagram App'; }
      else if (/musical_ly|BytedanceWebview|TikTok/i.test(ua)) { browser = 'TikTok App'; }
      else if (isBrave || /Brave/i.test(ua)) { browser = 'Brave'; browserVersion = matchVersion(ua, /Chrome\/([\d.]+)/i); }
      else if (/coc_coc|CocCoc/i.test(ua)) { browser = 'Cốc Cốc'; browserVersion = matchVersion(ua, /coc_coc_browser\/([\d.]+)/i); }
      else if (/EdgA|EdgiOS|Edg\//i.test(ua)) { browser = 'Edge'; browserVersion = matchVersion(ua, /Edg[A-Za-z]*\/([\d.]+)/i); }
      else if (/OPR\/|OPT\/|Opera/i.test(ua)) { browser = 'Opera'; browserVersion = matchVersion(ua, /(?:OPR|OPT)\/([\d.]+)/i); }
      else if (/SamsungBrowser/i.test(ua)) { browser = 'Samsung Internet'; browserVersion = matchVersion(ua, /SamsungBrowser\/([\d.]+)/i); }
      else if (/Vivaldi/i.test(ua)) { browser = 'Vivaldi'; browserVersion = matchVersion(ua, /Vivaldi\/([\d.]+)/i); }
      else if (/DuckDuckGo|Ddg\//i.test(ua)) { browser = 'DuckDuckGo'; }
      else if (/Firefox|FxiOS/i.test(ua)) { browser = 'Firefox'; browserVersion = matchVersion(ua, /(?:Firefox|FxiOS)\/([\d.]+)/i); }
      else if (/CriOS/i.test(ua)) { browser = 'Chrome (iOS)'; browserVersion = matchVersion(ua, /CriOS\/([\d.]+)/i); }
      else if (/; wv\)/i.test(ua)) { browser = 'Android WebView'; browserVersion = matchVersion(ua, /Chrome\/([\d.]+)/i); }
      else if (/Chrome\//i.test(ua)) { browser = 'Chrome'; browserVersion = matchVersion(ua, /Chrome\/([\d.]+)/i); }
      else if (/Safari/i.test(ua)) { browser = 'Safari'; browserVersion = matchVersion(ua, /Version\/([\d.]+)/i); }

      let timezone = '';
      try { timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}

      return {
        summary: `${deviceName} · ${browser}`,
        deviceName: deviceName,
        browser: browser,
        browserVersion: browserVersion ? browserVersion.split('.')[0] : '',
        os: osInfo,
        rawUserAgent: ua,
        rawModel: rawModel,
        screen: screenSig,
        platform: platform,
        timezone: timezone,
        language: navigator.language || '',
        cores: navigator.hardwareConcurrency || 0,
        memory: navigator.deviceMemory || 0,
        touch: navigator.maxTouchPoints || 0
      };
    }

    /* ----- Đếm số lần truy cập của trình duyệt này ----- */
    function nextVisitNo() {
      try {
        const n = (parseInt(localStorage.getItem('bubuVisitNo'), 10) || 0) + 1;
        localStorage.setItem('bubuVisitNo', String(n));
        return n;
      } catch (e) {
        return 0;
      }
    }

    /* ----- Vị trí qua IP: chạy song song, có timeout, không chặn việc ghi log ----- */
    function fetchJsonWithTimeout(url, ms, asText) {
      const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, ms);
      return fetch(url, ctrl ? { signal: ctrl.signal } : {})
        .then(function(res) { return asText ? res.text() : res.json(); })
        .then(function(v) { clearTimeout(timer); return v; })
        .catch(function(e) { clearTimeout(timer); throw e; });
    }

    function firstSuccess(tasks) {
      return new Promise(function(resolve, reject) {
        let pending = tasks.length;
        const fail = function() { if (--pending === 0) reject(new Error('Không có API nào trả về')); };
        tasks.forEach(function(t) {
          t().then(function(v) { if (v) resolve(v); else fail(); }).catch(fail);
        });
      });
    }

    function joinParts(parts) {
      return parts.filter(Boolean).join(', ');
    }

    async function fetchGeoInfo() {
      const apis = [
        async () => {
          const d = await fetchJsonWithTimeout('https://ipwho.is/', 4000);
          if (!d || d.success === false || !d.city) return null;
          return { location: joinParts([d.city, d.region, d.country]) };
        },
        async () => {
          const d = await fetchJsonWithTimeout('https://get.geojs.io/v1/ip/geo.json', 4000);
          if (!d || !d.city) return null;
          return { location: joinParts([d.city, d.region, d.country]) };
        },
        async () => {
          const d = await fetchJsonWithTimeout('https://ipapi.co/json/', 4000);
          if (!d || d.error || !d.city) return null;
          return { location: joinParts([d.city, d.region, d.country_name]) };
        }
      ];
      try {
        return await firstSuccess(apis);
      } catch (e) {}

      // Dự phòng: Cloudflare ít bị chặn nhưng chỉ biết quốc gia
      try {
        const txt = await fetchJsonWithTimeout('https://www.cloudflare.com/cdn-cgi/trace', 4000, true);
        const loc = (txt.match(/^loc=(.+)$/m) || [])[1] || '';
        if (loc) {
          return { location: `Không rõ thành phố (${loc.trim()})` };
        }
      } catch (e) {}
      return null;
    }

    let currentLogKey = null;
    let logExists = false;
    let logWatchedKey = null;

    // Theo dõi log hiện tại: nếu bị xóa thì không ghi đè lại (tránh tạo "log ma" thiếu thông tin)
    function watchLog(key) {
      if (!key || logWatchedKey === key) return;
      logWatchedKey = key;
      logExists = false;
      try {
        db.ref('logs/' + key).on('value', function(snap) { logExists = snap.exists(); });
      } catch (e) {}
    }
    let chatSessionStartTime = null;

    async function logAccess() {
      try {
        const info = await detectDeviceInfo();

        // Ghi log NGAY, vị trí cập nhật sau để không mất log khi mạng chậm / bị chặn
        const newRef = db.ref('logs').push({
          device: info.summary,
          browser: info.browser,
          browserVersion: info.browserVersion,
          os: info.os,
          location: '',
          visitNo: nextVisitNo(),
          rawUserAgent: info.rawUserAgent,
          rawModel: info.rawModel,
          screen: info.screen,
          platform: info.platform,
          viewedChat: false,
          durationSeconds: 0,
          timestamp: Date.now()
        });
        currentLogKey = newRef.key;
        watchLog(currentLogKey);
        try { sessionStorage.setItem('bubuLogKey', currentLogKey); } catch(e) {}

        const geo = await fetchGeoInfo();
        if (geo) {
          const upd = {};
          if (geo.location) upd.location = geo.location;
          if (Object.keys(upd).length) newRef.update(upd);
        }
      } catch (err) {
        console.error('Không thể lưu log:', err);
      }
    }
    logAccess();

    function updateDurationOnServer() {
      if (!currentLogKey || !chatSessionStartTime || !logExists) return;
      const elapsedSec = Math.floor((Date.now() - chatSessionStartTime) / 1000);
      if (elapsedSec > 0) {
        try {
          db.ref('logs/' + currentLogKey).child('durationSeconds').transaction(function(currentVal) {
            return (currentVal || 0) + elapsedSec;
          });
        } catch (e) {}
        chatSessionStartTime = Date.now();
      }
    }

    window.addEventListener('beforeunload', updateDurationOnServer);
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') {
        updateDurationOnServer();
      } else if (document.visibilityState === 'visible' && chatSessionStartTime) {
        chatSessionStartTime = Date.now();
      }
    });

    /* ============ LOGIC MODAL & MẬT KHẨU LOG ============ */
    let logUnlocked = false;

    function openLogModal() {
      document.getElementById('logModal').classList.add('open');
      if (!logUnlocked) {
        document.getElementById('logCardHeader').classList.remove('has-title');
        document.getElementById('logCardTitle').style.display = 'none';
        document.getElementById('btnClearLogs').style.display = 'none';
        document.getElementById('logPinPanel').style.display = 'flex';
        document.getElementById('logContent').classList.remove('show');
        document.getElementById('logPinError').textContent = '';
        const input = document.getElementById('logPinInput');
        input.value = '';
        setTimeout(() => input.focus(), 50);
      } else {
        showLogContent();
      }
    }

    function showLogContent() {
      document.getElementById('logCardHeader').classList.add('has-title');
      document.getElementById('logCardTitle').style.display = 'block';
      document.getElementById('btnClearLogs').style.display = 'block';
      document.getElementById('logPinPanel').style.display = 'none';
      document.getElementById('logContent').classList.add('show');
      listenToLogs();
    }

    function closeLogModal() {
      document.getElementById('logModal').classList.remove('open');
    }

    document.getElementById('logPinInput').addEventListener('input', async function(e) {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (e.target.value.length === 4) {
        let h = '';
        try {
          h = await hashPin(e.target.value);
        } catch (err) {
          document.getElementById('logPinError').textContent = 'Lỗi kiểm tra mật khẩu!';
          return;
        }
        if (h === LOG_PIN_HASH || h === LOG_PIN_HASH_FALLBACK) {
          logUnlocked = true;
          showLogContent();
        } else {
          document.getElementById('logPinError').textContent = 'Sai mật khẩu!';
          e.target.value = '';
        }
      }
    });

    function formatDuration(totalSeconds) {
      if (!totalSeconds || totalSeconds <= 0) return '';
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      if (mins === 0) return `⏱️ Đã ở lại: ${secs} giây`;
      return `⏱️ Đã ở lại: ${mins} phút ${secs} giây`;
    }

    function inferOsFromLegacyLog(item) {
      if (item.os) return item.os;
      const ua = item.rawUserAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) {
        const m = ua.match(/OS\s+([\d_]+)/i);
        return m ? `iOS ${m[1].replace(/_/g, '.')}` : 'iOS';
      }
      if (/Android/i.test(ua)) {
        return /Chrome\//i.test(ua) ? 'Android (không rõ phiên bản)' : ((ua.match(/Android\s+([\d.]+)/i) || [])[1] ? `Android ${ua.match(/Android\s+([\d.]+)/i)[1]}` : 'Android');
      }
      if (/Windows NT 10\.0/i.test(ua)) return 'Windows 10/11';
      if (/Windows/i.test(ua)) return 'Windows';
      if (/Mac OS X/i.test(ua)) return 'macOS (không rõ phiên bản)';
      if (/Linux/i.test(ua)) return 'Linux';
      if (item.platform) return item.platform;
      return 'Hệ điều hành không rõ';
    }

    function listenToLogs() {
      db.ref('logs').on('value', function(snapshot) {
        const logList = document.getElementById('logList');
        logList.innerHTML = '';
        const val = snapshot.val();
        if (!val) {
          logList.textContent = 'Chưa có nhật ký truy cập nào.';
          return;
        }

        const items = Object.entries(val).map(entry => ({ id: entry[0], ...entry[1] }))
                           .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        items.forEach(item => {
          const d = new Date(item.timestamp || NaN);
          const timeStr = !isNaN(d.getTime()) ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} - ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}` : 'Không rõ thời gian (log lỗi, có thể xóa)';
          
          const div = document.createElement('div');
          div.className = 'log-item';
          
          // Tra model lúc hiển thị để bảng DEVICE_MODELS mới áp dụng được cả log cũ
          let deviceName = item.device || 'Thiết bị không rõ';
          if (item.rawModel) {
            const browserPart = item.browser || (item.device || '').split(' · ').slice(1).join(' · ');
            const label = DEVICE_MODELS[item.rawModel]
              ? `${DEVICE_MODELS[item.rawModel]} (${item.rawModel})`
              : `Android (${item.rawModel})`;
            deviceName = browserPart ? `${label} · ${browserPart}` : label;
          }
          if (item.browserVersion && item.browser && deviceName.endsWith(item.browser)) {
            deviceName += ' ' + item.browserVersion;
          }
          const osName = inferOsFromLegacyLog(item);
          const locationName = item.location ? `📍 ${item.location}` : '📍 Không rõ vị trí';

          // Dùng textContent / DOM API thay cho innerHTML để chống chèn mã độc từ dữ liệu log
          const mk = function(tag, cls, text) {
            const el = document.createElement(tag);
            if (cls) el.className = cls;
            el.textContent = text;
            return el;
          };

          const delBtn = mk('button', 'log-delete-btn', 'Xóa');
          delBtn.addEventListener('click', function() { deleteSingleLog(item.id); });

          div.appendChild(mk('span', 'log-time', `[${timeStr}]`));
          div.appendChild(document.createTextNode(' '));
          div.appendChild(delBtn);
          div.appendChild(document.createElement('br'));
          div.appendChild(mk('span', 'log-device', `📱 ${deviceName}`));
          if (item.viewedChat) div.appendChild(mk('span', 'log-status-viewed', 'ĐÃ XEM'));
          div.appendChild(mk('span', 'log-os', `⚙️ Hệ điều hành: ${osName}`));
          div.appendChild(mk('span', 'log-location', locationName));
          if (item.visitNo) div.appendChild(mk('span', 'log-os', `🔢 Lần truy cập: ${item.visitNo}`));
          if (item.viewedChat && item.durationSeconds > 0) {
            div.appendChild(mk('div', 'log-duration', formatDuration(item.durationSeconds)));
          }
          logList.appendChild(div);
        });
      });
    }

    function clearLogs() {
      if (confirm('Bạn có chắc chắn muốn xóa toàn bộ lịch sử log truy cập không? 🗑️')) {
        db.ref('logs').remove()
          .then(() => alert('Đã xóa sạch lịch sử log!'))
          .catch((err) => alert('Lỗi khi xóa log: ' + err.message));
      }
    }

    function deleteSingleLog(logId) {
      if (confirm('Bạn có muốn xóa mục log này không?')) {
        db.ref('logs/' + logId).remove()
          .catch((err) => alert('Lỗi khi xóa log: ' + err.message));
      }
    }

    /* ============ LOGIC CHAT BUBU & DUDU ============ */
    const PIN_HASH = 'e52970b369047515d3dd25be5bdcd9bd10e0cfec7801248c9d7de596ff2df504';
    const PIN_HASH_FALLBACK = 'fdece82f7';
    const DELETE_PIN_HASH = 'a34d7e85c4327364a66a5746b6a8ffb97a0d26cae27eb40403a17a31803942c2';
    const DELETE_PIN_HASH_FALLBACK = 'ff5fa1a3f';

    let chatUnlocked = false;
    const messages = new Map();

    async function verifyDeletePinPrompt(actionText) {
      const inputPin = prompt(actionText || 'Vui lòng nhập mật khẩu xóa dữ liệu:');
      if (!inputPin) return false;
      try {
        const h = await hashPin(inputPin.trim());
        if (h === DELETE_PIN_HASH || h === DELETE_PIN_HASH_FALLBACK) {
          return true;
        } else {
          alert('Sai mật khẩu xóa dữ liệu!');
          return false;
        }
      } catch (err) {
        alert('Có lỗi xảy ra khi kiểm tra mật khẩu.');
        return false;
      }
    }

    try {
      db.ref('notes').on('value', function(snapshot) {
        messages.clear();
        const val = snapshot.val();
        if (val) {
          Object.keys(val).forEach(function(key) {
            messages.set(key, val[key]);
          });
        }
        if (chatUnlocked) {
          renderChat(true);
        }
      });
    } catch (e) {
      console.error(e);
    }

    function showPinError(msg) {
      const input = document.getElementById('pinInput');
      document.getElementById('pinError').textContent = msg;
      input.value = '';
      input.classList.remove('pin-shake');
      void input.offsetWidth;
      input.classList.add('pin-shake');
    }

    function showPinScreen() {
      updateDurationOnServer();
      chatSessionStartTime = null;

      chatUnlocked = false;
      document.getElementById('pinPanel').style.display = 'flex';
      document.getElementById('chatBody').classList.remove('open');
      document.getElementById('meSwitch').style.display = 'none';
      document.getElementById('clearAllBtn').style.display = 'none';
      document.getElementById('pinError').textContent = '';
      const input = document.getElementById('pinInput');
      input.value = '';
      setTimeout(() => input.focus(), 50);
    }

    function unlockChat() {
      chatUnlocked = true;
      document.getElementById('pinPanel').style.display = 'none';
      document.getElementById('chatBody').classList.add('open');
      document.getElementById('meSwitch').style.display = 'flex';
      document.getElementById('clearAllBtn').style.display = 'block';
      document.getElementById('pinInput').blur();

      chatSessionStartTime = Date.now();

      if (!currentLogKey) {
        try { currentLogKey = sessionStorage.getItem('bubuLogKey'); } catch(e) {}
      }
      if (currentLogKey) {
        const key = currentLogKey;
        watchLog(key);
        try {
          // Chỉ đánh dấu "đã xem" khi log còn tồn tại
          db.ref('logs/' + key + '/timestamp').once('value').then(function(snap) {
            if (snap.exists()) db.ref('logs/' + key).update({ viewedChat: true });
          });
        } catch (err) {
          console.error('Không thể cập nhật trạng thái đã xem:', err);
        }
      }

      try { applyMe(); } catch (err) { console.error(err); }
      
      renderChat(true);
    }

    function openChat() {
      document.getElementById('chatOverlay').classList.add('open');
      if (!chatUnlocked) showPinScreen();
    }

    function closeChat() {
      updateDurationOnServer();
      document.getElementById('chatInput').blur();
      document.getElementById('chatOverlay').classList.remove('open');
      showPinScreen();
    }

    document.getElementById('pinInput').addEventListener('input', async function(e) {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (e.target.value.length === 4) {
        let h = '';
        try {
          h = await hashPin(e.target.value);
        } catch (err) {
          showPinError('Lỗi kiểm tra mật khẩu');
          return;
        }
        if (h === PIN_HASH || h === PIN_HASH_FALLBACK) {
          unlockChat();
        } else {
          showPinError('Sai mật khẩu, thử lại nhé');
        }
      }
    });

    let me = 'Bubu';
    try {
      const saved = localStorage.getItem('bubuChatMe');
      if (saved === 'Bubu' || saved === 'Dudu') me = saved;
    } catch (err) {}

    function applyMe() {
      document.querySelectorAll('#meSwitch button').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.me === me);
      });
    }

    function setMe(name) {
      me = name;
      try { localStorage.setItem('bubuChatMe', name); } catch (err) {}
      applyMe();
      renderChat(false);
    }

    async function confirmClearAll() {
      const isAuth = await verifyDeletePinPrompt('Vui lòng nhập mật khẩu xóa dữ liệu để XÓA TẤT CẢ:');
      if (!isAuth) return;

      if (confirm('You sure want to clear all chat? 🗑️')) {
        db.ref('notes').remove()
          .then(() => alert('Đã xóa sạch toàn bộ dữ liệu tin nhắn cũ!'))
          .catch((err) => alert('Lỗi xóa dữ liệu: ' + err.message));
      }
    }

    const mediaFile = document.getElementById('mediaFile');
    mediaFile.addEventListener('change', function() {
      const file = mediaFile.files[0];
      const preview = document.getElementById('attachPreview');
      if (file) {
        document.getElementById('attachName').textContent = (file.type.startsWith('video') ? '🎬 ' : '🖼️ ') + file.name;
        preview.classList.add('show');
      } else {
        preview.classList.remove('show');
      }
    });

    function clearAttachment() {
      mediaFile.value = '';
      document.getElementById('attachPreview').classList.remove('show');
    }

    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendMessage() {
      const text = chatInput.value.trim();
      const file = mediaFile.files[0];
      if (!text && !file) return;

      const base = {
        sender: me,
        timestamp: Date.now()
      };
      if (text) base.text = text;

      if (file) {
        if (file.size > 8 * 1024 * 1024) {
          alert('Tệp quá lớn! Vui lòng chọn tệp nhỏ hơn 8MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          base.mediaUrl = e.target.result;
          base.mediaType = file.type.startsWith('video') ? 'video' : 'image';
          db.ref('notes').push(base);
        };
        reader.readAsDataURL(file);
      } else {
        db.ref('notes').push(base);
      }

      chatInput.value = '';
      clearAttachment();
      chatInput.focus();
    }

    function renderChat(scrollToBottom) {
      const box = document.getElementById('chatMessages');
      box.innerHTML = '';

      const list = Array.from(messages.entries())
        .map(function(entry) { return { id: entry[0], data: entry[1] }; })
        .sort(function(a, b) { return (a.data.timestamp || 0) - (b.data.timestamp || 0); });

      if (list.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'chat-empty';
        empty.textContent = 'Chưa có tin nhắn nào. Nhắn gì đó cho người thương đi nè 💌';
        box.appendChild(empty);
        return;
      }

      list.forEach(function(item) {
        const data = item.data;
        const ts = data.timestamp || Date.now();
        const mine = data.sender === me;

        const row = document.createElement('div');
        row.className = 'msg-row ' + (mine ? 'mine' : 'theirs') + ' show-actions';

        const senderName = data.sender || 'Bubu';
        const name = document.createElement('div');
        name.className = 'msg-sender';
        name.textContent = (senderName === 'Bubu' ? '🐻‍❄️ ' : '🐻 ') + senderName;
        row.appendChild(name);

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (data.mediaUrl) {
          if (data.mediaType === 'video') {
            const v = document.createElement('video');
            v.src = data.mediaUrl;
            v.controls = true;
            v.playsInline = true;
            bubble.appendChild(v);
          } else {
            const img = document.createElement('img');
            img.src = data.mediaUrl;
            bubble.appendChild(img);
          }
        }
        if (data.text) {
          const t = document.createElement('span');
          t.textContent = data.text;
          bubble.appendChild(t);
        }

        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        const d = new Date(ts);
        const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        const time = document.createElement('span');
        time.textContent = timeStr;
        meta.appendChild(time);

        const del = document.createElement('button');
        del.className = 'msg-delete';
        del.textContent = 'Xóa';
        del.onclick = async function() {
          if (await verifyDeletePinPrompt('Vui lòng nhập mật khẩu xóa dữ liệu:')) {
            db.ref('notes/' + item.id).remove();
          }
        };
        meta.appendChild(del);

        row.appendChild(bubble);
        row.appendChild(meta);
        box.appendChild(row);
      });

      if (scrollToBottom) {
        box.scrollTop = box.scrollHeight;
      }
    }
  </script>
</body>
</html>
