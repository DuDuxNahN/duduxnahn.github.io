<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubu & Dudu Hugs 🐾</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fceade;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .scene-container {
      text-align: center;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 3px solid #f4a261;
      max-width: 90%;
      width: 380px;
    }

    .gif-box {
      width: 220px;
      height: 220px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gif-box img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
    }

    .btn-action {
      background-color: #e76f51;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(231, 111, 81, 0.4);
      width: 100%;
      transition: 0.2s;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    .message-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
      animation: fadeIn 0.8s ease;
    }

    .message-input {
      padding: 12px 16px;
      border: 2px solid #f4a261;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
      text-align: center;
      width: 100%;
    }

    /* Khung lời nhắn di chuyển và nảy quanh màn hình */
    .floating-note {
      position: absolute;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

    /* 6 kiểu khung chữ với màu sắc khác nhau */
    .style-1 { background: #fff0f3; color: #ff4d6d; border: 2px solid #ff758c; }
    .style-2 { background: #e8f4f8; color: #1d3557; border: 2px solid #457b9d; }
    .style-3 { background: #fefae0; color: #bc6c25; border: 2px solid #dda15e; }
    .style-4 { background: #f3c4fb; color: #7209b7; border: 2px solid #b5179e; }
    .style-5 { background: #e2f0cb; color: #386641; border: 2px solid #6a994e; }
    .style-6 { background: #ffccd5; color: #c9184a; border: 2px solid #ff758c; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Thư viện Firebase bản tương thích (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="scene-container">
    <div class="gif-box">
      <img id="bubuGif" src="bubu1.gif" alt="">
    </div>

    <button id="hugBtn" class="btn-action" onclick="startHug()">Ấn để Dudu ôm Bubu 🐾</button>

    <div id="messageForm" class="message-form">
      <input type="text" id="noteInput" class="message-input" placeholder="Để lại lời nhắn chung..." maxlength="50">
      <button class="btn-action" style="background-color: #2a9d8f;" onclick="saveNote()">Gửi lời nhắn ✨</button>
    </div>
  </div>

  <script>
    // Cấu hình Firebase của bạn
    const firebaseConfig = {
      apiKey: "AIzaSyABW8qlALzqJXB5GYReEz2gMFmIMHzHXBM",
      authDomain: "budu-note.firebaseapp.com",
      databaseURL: "https://budu-note-default-rtdb.firebaseio.com",
      projectId: "budu-note",
      storageBucket: "budu-note.firebasestorage.app",
      messagingSenderId: "751175174116",
      appId: "1:751175174116:web:13ceee8e30b1d22a0469f1"
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function startHug() {
      const gifImg = document.getElementById('bubuGif');
      const hugBtn = document.getElementById('hugBtn');
      const messageForm = document.getElementById('messageForm');

      gifImg.src = "bubu2.gif";
      hugBtn.style.display = 'none';
      messageForm.style.display = 'flex';
    }

    function saveNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();

      if (text !== "") {
        db.ref('notes').push({
          text: text
        });
        input.value = '';
      }
    }

    // Hàm tạo và điều khiển hiệu ứng nảy quanh màn hình
    function createBouncingNote(text) {
      const note = document.createElement('div');
      
      // Chọn ngẫu nhiên kiểu màu sắc từ style-1 đến style-6
      const randomStyleNum = Math.floor(Math.random() * 6) + 1;
      note.className = `floating-note style-${randomStyleNum}`;
      note.innerText = '💌 ' + text;
      document.body.appendChild(note);

      // Vị trí xuất phát ngẫu nhiên
      let posX = Math.random() * (window.innerWidth - 150);
      let posY = Math.random() * (window.innerHeight - 100);

      // Tốc độ và hướng di chuyển ngẫu nhiên (Vận tốc X và Y)
      let speedX = (Math.random() - 0.5) * 3;
      let speedY = (Math.random() - 0.5) * 3;
      if (Math.abs(speedX) < 1) speedX = 1.5;
      if (Math.abs(speedY) < 1) speedY = 1.5;

      function updatePosition() {
        const rect = note.getBoundingClientRect();
        const maxX = window.innerWidth - rect.width;
        const maxY = window.innerHeight - rect.height;

        posX += speedX;
        posY += speedY;

        // Chạm cạnh trái hoặc phải thì đổi hướng (nảy lại)
        if (posX <= 0 || posX >= maxX) {
          speedX *= -1;
          posX = Math.max(0, Math.min(posX, maxX));
        }

        // Chạm cạnh trên hoặc dưới thì đổi hướng (nảy lại)
        if (posY <= 0 || posY >= maxY) {
          speedY *= -1;
          posY = Math.max(0, Math.min(posY, maxY));
        }

        note.style.left = posX + 'px';
        note.style.top = posY + 'px';

        requestAnimationFrame(updatePosition);
      }

      requestAnimationFrame(updatePosition);
    }

    // Tự động lắng nghe lời nhắn thời gian thực từ mọi người
    window.onload = function() {
      db.ref('notes').on('child_added', function(snapshot) {
        const data = snapshot.val();
        if (data && data.text) {
          createBouncingNote(data.text);
        }
      });
    };
  </script>
</body>
</html>
